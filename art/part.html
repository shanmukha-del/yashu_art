<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PROJECT-D | PARTS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<style>
    body {
      margin:0;
      background: var(--deep-black);
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow: hidden;
    }
    nav {
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(6, 11, 19, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }
    nav h2 {
      margin: 0;
      font-weight: 950;
      letter-spacing: -2px;
      font-size: 28px;
    }
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 30px;
      padding: 60px 10%;
      overflow-y: auto;
      perspective: 1500px;
    }
    .part {
      height: 180px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
      position: relative;
    }
    .part:hover {
      transform: translateY(-15px) rotateX(10deg) scale(1.05);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 40px var(--neon-cyan-glow);
    }
    .part::before {
      content: "MODULE";
      font-size: 10px;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .disabled {
      opacity: 0.2;
      cursor: not-allowed;
      filter: grayscale(1);
    }
  </style>
</head>
<body>
<canvas id="canvas3d"></canvas>

<nav>
  <h2>PROJECT <span class="blue-text">-D</span></h2>
  <button onclick="location.href='home.html'" class="btn-cyan">🏠 Home</button>
</nav>

<div class="grid">
  <div class="part" onclick="location.href='part-1.html'">01</div>
  <div class="part disabled" onclick="coming()">02</div>
  <div class="part disabled" onclick="coming()">03</div>
  <div class="part disabled" onclick="coming()">04</div>
  <div class="part disabled" onclick="coming()">05</div>
  <div class="part disabled" onclick="coming()">06</div>
  <div class="part disabled" onclick="coming()">07</div>
  <div class="part disabled" onclick="coming()">08</div>
  <div class="part disabled" onclick="coming()">09</div>
  <div class="part disabled" onclick="coming()">10</div>
</div>

<script src="background3d.js"></script>
<script>
function coming(){
  alert("✨ System Module Coming Soon...");
}
</script>
</body>
</html>
